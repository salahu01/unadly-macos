<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Unadly app icon. Artwork sits on Apple's 1024 grid: 824px squircle with a 100px margin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb566"/>
      <stop offset="1" stop-color="#0d6b3b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f7ee"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04361c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g transform="translate(100 100)">
    <!-- rounded square, macOS corner radius (~22.5%) -->
    <rect width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect width="824" height="824" rx="185" fill="url(#shine)"/>
    <!-- shield -->
    <path filter="url(#drop)" fill="url(#shield)"
      d="M412 128
         C480 168 560 190 632 194
         C642 194 650 202 650 212
         V404
         C650 540 560 640 412 706
         C264 640 174 540 174 404
         V212
         C174 202 182 194 192 194
         C264 190 344 168 412 128 Z"/>
    <!-- U -->
    <path d="M322 284 V418 A90 90 0 0 0 502 418 V284" fill="none" stroke="#159150" stroke-width="72" stroke-linecap="round"/>
  </g>
</svg>
